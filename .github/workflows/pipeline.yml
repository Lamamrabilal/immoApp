name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/projet_app_immo-web
  PYTHON_VERSION: "3.11"


jobs:

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.1.0
        with:
          fetch-depth: 0

      # FIX : cairo requis dans tous les jobs qui font pip install
      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            pkg-config \
            python3-dev

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Lint avec Ruff
        run: ruff check .

      - name: Vérification du formatage avec Black
        run: black --check .


  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: immo_db_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: django-insecure-test-key-for-ci-only
      DJANGO_DATABASE_URL: postgres://user:password@localhost:5432/immo_db_test
      ALLOWED_HOSTS: localhost,127.0.0.1
      DEBUG: "True"

    steps:
      - name: Checkout du code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.1.0

      # FIX : cairo requis ici aussi
      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            pkg-config \
            python3-dev

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      # FIX : | manquant — sans lui, seule la 1ère ligne s'exécutait
      - name: Lancement des tests avec pytest
        run: |
          pip install pytest pytest-cov
          pytest --doctest-modules \
            --junitxml=junit/test-results.xml \
            --cov=. \
            --cov-report=xml \
            --cov-report=html

      - name: Upload des résultats de tests
        uses: actions/upload-artifact@v4
        # Toujours uploader, même si les tests échouent
        if: always()
        with:
          name: test-results
          path: |
            junit/test-results.xml
            htmlcov/


  build:
    name: Build
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.1.0

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            pkg-config \
            python3-dev

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Build / collecte des fichiers statiques
        run: python manage.py collectstatic --noinput