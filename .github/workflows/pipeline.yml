name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/projet_app_immo-web
  PYTHON_VERSION: "3.11"


jobs:

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.1.0
        with:
          fetch-depth: 0

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            pkg-config \
            python3-dev

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Vérification syntaxique Python
        run: |
          find . -name "*.py" ! -path "*/migrations/*" -print0 | \
          xargs -0 -I {} python -m py_compile {}


  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: immo_db_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: django-insecure-test-key-for-ci-only
      DJANGO_DATABASE_URL: postgres://user:password@localhost:5432/immo_db_test
      ALLOWED_HOSTS: localhost,127.0.0.1
      DEBUG: "True"

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.1.0

      - name: Installer les dépendances système
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential \
            pkg-config \
            cmake \
            libcairo2-dev \
            libpq-dev \
            libffi-dev \
            libjpeg-dev \
            zlib1g-dev
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Appliquer les migrations
        run: python manage.py migrate --settings=projet_app_immo.settings_test

      - name: Lancer les tests
        run: |
          python manage.py test \
            --settings=projet_app_immo.settings_test \
            --verbosity=2

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.1.0

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            pkg-config \
            python3-dev

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Build / collecte des fichiers statiques
        run: python manage.py collectstatic --noinput